[package]
name = "milvus-sdk-rust"
description = "The official Milvus Rust SDK"
version = "3.0.0"
edition = "2021"
rust-version = "1.86"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/milvus-io/milvus-sdk-rust"
homepage = "https://milvus.io"
documentation = "https://docs.rs/milvus-sdk-rust"
keywords = ["milvus", "vector-database", "database", "sdk"]
categories = ["database"]
include = [
    "/Cargo.toml",
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/milvus-proto/proto/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-A", "rustdoc::bare-urls"]

[features]
tracing = ["dep:tracing"]

[lib]
name = "milvus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonic = { version = "0.13.1", features = ["tls-native-roots", "prost"] }
prost = ">=0.13, <0.14"
tokio = { version = "1.17.0", features = ["full"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
hostname = "0.4"
sha2 = "0.10"
strum = "0.24"
strum_macros = "0.24"
base64 = "0.22.1"
dashmap = "5.5.3"
futures = "0.3.31"
lazy_static = "1.4"
lru = "0.12"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
tokio-util = "0.7"
tracing = { version = "0.1", optional = true }
uuid = { version = "1.11", features = ["v4"] }

[build-dependencies]
tonic-build = { version = "0.13", default-features = false, features = [
    "prost",
] }
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
rand = "0.8.5"
tokio-stream = { version = "0.1", features = ["net"] }

[[test]]
name = "v1_st"
path = "tests/v1/mod.rs"

[[test]]
name = "v2_ut"
path = "tests/v2/ut/mod.rs"

