pull_request_rules:
  - name: Add needs-dco label when DCO check failed
    conditions:
      - base=main
      - -status-success=DCO
    actions:
      label:
        remove:
          - dco-passed
        add:
          - needs-dco
      comment:
        message: |
          @{{author}} Thanks for your contribution. Please submit with DCO, see the contributing guide https://github.com/milvus-io/milvus/blob/master/CONTRIBUTING.md#developer-certificate-of-origin-dco.
  - name: Add dco-passed label when DCO check passed
    conditions:
      - base=main
      - status-success=DCO
    actions:
      label:
        remove:
          - needs-dco
        add:
          - dco-passed

  - name: Add ci-passed when eligible
    conditions:
      - base=main
      - "check-success=UT on Ubuntu-22.04"
      - "check-success=UT on MacOS 15"
    actions:
      label:
        add:
          - ci-passed

  - name: Remove ci-passed when checks are not green
    conditions:
      - base=main
      - label=ci-passed
      - or:
        - "-check-success=UT on Ubuntu-22.04"
        - "-check-success=UT on MacOS 15"
      - files~=^(?!\.github\/mergify\.yml).*$
      - files~=\.(?!md|png)
    actions:
      label:
        remove:
          - ci-passed

  - name: Add ci-passed when no code changes
    conditions:
      - base=main
      - "-files~=^(?!(.*\\.md$|.*\\.png$|\\.gitignore$|codecov\\.yml$|LICENSE$|OWNERS$|\\.github/mergify\\.yml$)).+"
    actions:
      label:
        add:
          - ci-passed
