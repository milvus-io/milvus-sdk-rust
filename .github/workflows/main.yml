name: Unittest

on:
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'tutorial/**'
      - 'scripts/**'
      - 'milvus-proto/**'
      - 'Cargo.toml'
      - 'build.rs'
      - '.github/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ut-linux:
    name: UT on Ubuntu-${{ matrix.ubuntu }}
    # The type of runner that the job will run on
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [22.04]
    env:
      UBUNTU: ${{ matrix.ubuntu }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          submodules: 'true'

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: ./scripts/install_deps.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run coverage
        run: CODE_COV=true ./scripts/run_tests.sh

      - name: Upload coverage to Codecov
        if: github.repository == 'milvus-io/milvus-sdk-rust'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./code_coverage/lcov.info
          flags: ubuntu-${{ matrix.ubuntu }}-unittests

  ut-macos:
    name: UT on MacOS 15
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: SKIP_COVERAGE_TOOLS=true ./scripts/install_deps.sh

      # GitHub-hosted macOS runners cannot run the Milvus container because nested
      # virtualization is unavailable. Linux runs the server-backed suite.
      - name: Run non-server tests
        run: ./scripts/run_tests.sh --no-server
